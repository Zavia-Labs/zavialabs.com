<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zavia — Enterprise Decision Fabric</title>
<meta name="description" content="Zavia is building a new infrastructure for enterprise decision-making. Operating in stealth." />

<meta property="og:title" content="Zavia — Enterprise Decision Fabric" />
<meta property="og:description" content="A new infrastructure for how organizations think, decide, and act. Operating in stealth." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://zavialabs.com/" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Zavia — Enterprise Decision Fabric" />
<meta name="twitter:description" content="A new infrastructure for how organizations think, decide, and act. Operating in stealth." />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.78em%22 font-size=%2290%22 font-weight=%22800%22 fill=%22%2318181b%22 font-family=%22sans-serif%22>Z</text></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --background: #faf9f6;
    --foreground: #18181b;
    --muted:      #6b7280;
    --border:     #e4e4e4;
  }

  *{ box-sizing: border-box; }

  html,body{ height:100%; margin:0; }

  body{
    background: var(--background);
    color: var(--foreground);
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
  }

  header{
    padding: clamp(28px, 6vw, 56px) clamp(24px, 6vw, 64px) 0;
    text-align:center;
  }

  .wordmark{
    font-size: 13px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 40px clamp(20px, 8vw, 64px);
  }

  h1{
    font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 7.5vw, 5.5rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin: 0 0 30px;
    max-width: 16ch;
    color: var(--foreground);
  }

  p.sub{
    max-width: 46ch;
    margin: 0 auto;
    font-size: clamp(16px, 1.8vw, 19px);
    line-height: 1.6;
    color: var(--muted);
    font-weight: 400;
  }

  .badge{
    margin-top: 44px;
    display:inline-flex;
    align-items:center;
    gap: 10px;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--foreground);
    padding: 12px 24px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #ffffff;
  }

  .badge::before{
    content:"";
    width:7px; height:7px;
    border-radius:50%;
    background: var(--foreground);
  }

  footer{
    padding: 0 clamp(24px, 6vw, 64px) clamp(24px, 5vw, 40px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size: 12px;
    color: var(--muted);
  }

  footer a{
    color: var(--muted);
    text-decoration:none;
    border-bottom: 1px solid var(--border);
    transition: color .2s ease, border-color .2s ease;
  }
  footer a:hover{ color: var(--foreground); border-color: var(--muted); }

  a:focus-visible, .badge:focus-visible{
    outline: 2px solid var(--foreground);
    outline-offset: 3px;
  }

  @media (max-width: 520px){
    footer{ flex-direction:column; gap:10px; text-align:center; }
  }
</style>
</head>
<body>

  <header>
    <div class="wordmark">Zavia Labs</div>
  </header>

  <main>
    <h1>Enterprise Decision Fabric</h1>
    <p class="sub">
      A quiet rethinking of how organizations reason, decide, and move.
      Precise infrastructure for consequential choices.
    </p>
    <span class="badge">Operating in stealth</span>
  </main>

  <footer>
    <span>&copy; 2026 Zavia</span>
    <a href="mailto:hello@zavialabs.com">hello@zavialabs.com</a>
  </footer>

</body>
</html>
